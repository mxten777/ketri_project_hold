<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="새로운 경험을 준비하고 있습니다.">
    <title>새로운 시작을 준비중입니다</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, #4A90E2 0%, #5EA3E8 50%, #7BB3F0 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #2c3e50;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.08) 0%, transparent 40%);
            pointer-events: none;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
        }

        .header {
            width: 100%;
            padding: 30px 20px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .logo {
            max-width: 260px;
            width: 100%;
            height: auto;
            opacity: 0;
            animation: fadeInDown 0.8s ease-out forwards;
            background: white;
            padding: 15px 25px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .message-box {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            padding: 35px 45px 35px;
            border-radius: 24px;
            box-shadow: 
                0 30px 90px rgba(0, 0, 0, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            max-width: 820px;
            width: 100%;
            position: relative;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.2s forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-box::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 5px;
            background: linear-gradient(90deg, #1e3c72, #7e22ce);
            border-radius: 0 0 3px 3px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 24px;
            background: linear-gradient(135deg, #1e3c72, #7e22ce);
            color: white;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(126, 34, 206, 0.3);
        }

        .status-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }
        }

        .message-box h1 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #0f172a 0%, #1e3c72 50%, #7e22ce 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            line-height: 1.3;
            letter-spacing: -1px;
        }

        .message-box p {
            font-size: 14px;
            font-weight: 400;
            color: #475569;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 18px 0;
        }

        .feature-item {
            text-align: center;
            padding: 14px 8px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 10px;
            transition: all 0.3s ease;
            border: 1px solid #e2e8f0;
        }

        .feature-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(30, 60, 114, 0.15);
            border-color: #cbd5e1;
        }

        .feature-icon {
            width: 34px;
            height: 34px;
            margin: 0 auto 6px;
            background: linear-gradient(135deg, #1e3c72, #7e22ce);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(126, 34, 206, 0.3);
        }

        .feature-text {
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
        }

        .divider {
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #667eea, transparent);
            margin: 16px auto;
        }

        .contact-info {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            padding: 0;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .contact-item:hover {
            color: #1e3c72;
            transform: translateY(-2px);
        }

        .contact-item svg {
            width: 18px;
            height: 18px;
            opacity: 0.7;
        }

        .footer {
            width: 100%;
            padding: 30px 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            position: relative;
            z-index: 1;
        }

        /* 모바일 대응 */
        @media (max-width: 768px) {
            .header {
                padding: 40px 20px;
            }

            .logo {
                max-width: 240px;
            }

            .message-box {
                padding: 45px 35px 40px;
            }

            .message-box h1 {
                font-size: 28px;
                margin-bottom: 18px;
            }

            .message-box p {
                font-size: 16px;
                margin-bottom: 32px;
            }

            .status-badge {
                font-size: 11px;
                padding: 8px 18px;
                margin-bottom: 28px;
            }

            .features {
                grid-template-columns: 1fr;
                gap: 14px;
                margin: 28px 0;
            }

            .feature-item {
                padding: 18px 12px;
            }

            .feature-icon {
                width: 40px;
                height: 40px;
                font-size: 16px;
                margin-bottom: 10px;
            }

            .footer {
                padding: 24px 20px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 30px 20px;
            }

            .logo {
                max-width: 200px;
            }

            .message-box {
                padding: 35px 24px 32px;
                border-radius: 20px;
            }

            .message-box h1 {
                font-size: 24px;
            }

            .message-box p {
                font-size: 15px;
            }

            .features {
                gap: 12px;
            }

            .feature-item {
                padding: 16px 12px;
            }

            .feature-icon {
                width: 38px;
                height: 38px;
                font-size: 16px;
            }

            .notify-section {
                padding: 20px 16px;
            }

            .notify-title {
                font-size: 15px;
            }

            .contact-info {
                flex-direction: column;
                gap: 12px;
                padding: 20px 0 0;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <img src="/680px_logo_white.png" alt="회사 로고" class="logo">
    </header>

    <main class="main-content">
        <div class="message-box">
            <div class="status-badge">Coming Soon</div>
            <h1>더 나은 경험을 위해<br>새롭게 준비하고 있습니다</h1>
            <p>혁신적인 서비스와 최상의 사용자 경험을 제공하기 위해<br>전면적인 개편 작업을 진행중입니다.</p>
            
            <div class="features">
                <div class="feature-item">
                    <div class="feature-icon">⚡</div>
                    <div class="feature-text">빠른 성능</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🎨</div>
                    <div class="feature-text">새로운 디자인</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🔒</div>
                    <div class="feature-text">강화된 보안</div>
                </div>
            </div>

            <div class="divider"></div>
            <div class="contact-info">
                <div class="contact-item">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                    </svg>
                    <span>043-237-7824~5</span>
                </div>
                <div class="contact-item">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                    <span>kesri0728@naver.com</span>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 All rights reserved.</p>
    </footer>
</body>
</html>
